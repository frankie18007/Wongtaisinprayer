touch-action: manipulation;
}
.text-shadow-gold {
text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
}
/* Animated Smoke for Incense */
.incense-smoke {
position: absolute;
bottom: 60px;
left: 50%;
transform: translateX(-50%);
width: 8px;
height: 40px;
background: linear-gradient(to top, rgba(255, 255, 255, 0.9), transparent);
border-radius: 50%;
filter: blur(3px);
animation: burnSmoke 2.5s infinite ease-out;
pointer-events: none;
}
@keyframes burnSmoke {
0% { transform: translateX(-50%) translateY(0) scaleX(1); opacity: 0.9; }
50% { transform: translateX(-40%) translateY(-30px) scaleX(2.5); opacity: 0.6; }
100% { transform: translateX(-60%) translateY(-70px) scaleX(4); opacity: 0; }
}
/* Shake animation for divination bucket */
@keyframes shakeBucket {
0% { transform: rotate(0deg); }
20% { transform: rotate(-12deg) translateY(-5px); }
40% { transform: rotate(12deg) translateY(-2px); }
60% { transform: rotate(-10deg) translateY(-5px); }
80% { transform: rotate(10deg) translateY(-2px); }
100% { transform: rotate(0deg); }
}
.shake-animation {
animation: shakeBucket 0.4s infinite;
}
</style>

<script>
lucide.createIcons();
let isSoundOn = true;
let fruitCount = 0;
let ingotCount = 0;
let currentLotResult = null;
let prayerRecords = JSON.parse(localStorage.getItem('wongtaisin_prayers') || '[]');
function switchScene(sceneKey) {
playChime();
const tabMain = document.getElementById('tab-main');
const tabStatue = document.getElementById('tab-statue');
const tabYuelao = document.getElementById('tab-yuelao');
const panelMain = document.getElementById('panel-main');
const panelStatue = document.getElementById('panel-statue');
const panelYuelao = document.getElementById('panel-yuelao');
const shrineCard = document.getElementById('shrine-card');
const title = document.getElementById('shrine-title');
const subtitle = document.getElementById('shrine-subtitle');
const icon = document.getElementById('deity-icon');
const speaker = document.getElementById('speaker-name');
[panelMain, panelStatue, panelYuelao].forEach(p => p.classList.add('hidden'));
if (sceneKey === 'main') {
panelMain.classList.remove('hidden');
shrineCard.style.backgroundImage = "linear-gradient(to bottom, rgba(13, 4, 4, 0.45), rgba(13, 4, 4, 0.75)), url('https://img.news.cn/2023-09/29/104074122_16959586149411n.jpg')";
title.innerText = "赤松黃大仙祠 正殿";
subtitle.innerText = "普濟勸善 • 廣施甘霖";
icon.className = "fa-solid fa-gopuram text-5xl text-temple-gold";
speaker.innerText = "赤松黃大仙尊者 顯聖法音";
setMasterSpeech("「歡迎回到黃大仙正殿。誠心所致，金石為開。可在此點香、供奉或搖筒求籤。」");
} else if (sceneKey === 'statue') {
panelStatue.classList.remove('hidden');
panelStatue.classList.add('grid');
shrineCard.style.backgroundImage = "linear-gradient(to bottom, rgba(13, 4, 4, 0.4), rgba(13, 4, 4, 0.8)), url('https://img.news.cn/2023-09/29/104074122_16959586149411n.jpg')";
title.innerText = "從心苑 黃大仙金身";
subtitle.innerText = "金光護體 • 開懷慈悲";
icon.className = "fa-solid fa-hands-praying text-5xl text-yellow-300";
speaker.innerText = "黃大仙開懷金身 聖音";
setMasterSpeech("「此乃從心苑黃大仙開懷金身聖像。大仙慈悲開懷，點擊『瞻仰金身』可沾納吉氣平安！」");
} else if (sceneKey === 'yueLao') {
panelYuelao.classList.remove('hidden');
panelYuelao.classList.add('grid');
shrineCard.style.backgroundImage = "linear-gradient(to bottom, rgba(13, 4, 4, 0.5), rgba(13, 4, 4, 0.85)), url('https://img.news.cn/2023-09/29/104074122_16959586149411n.jpg')";
title.innerText = "月老殿 姻緣神案";
subtitle.innerText = "殿前金童繩繫三生約";
icon.className = "fa-solid fa-heart text-5xl text-pink-400";
speaker.innerText = "月老尊神 慈悲指引";
setMasterSpeech("「殿前金童繩繫三生約。誠心在月老尊神前牽繫紅線，祈求千里姻緣一線牽！」");
}
}
function burnIncenseAction() {
playWoodenFishSound();
document.getElementById('incense-smoke-container').classList.remove('hidden');
document.getElementById('incense-status').innerText = "香火鼎盛";
document.getElementById('incense-status').className = "text-sm font-bold text-red-400 animate-pulse";
setMasterSpeech("「三柱清香燃起，褭褭煙霧上達天庭。黃大仙賜福信士平安吉祥！」");
}
function offerFruitAction() {
playChime();
fruitCount++;
document.getElementById('fruit-count').innerText = ⁠鮮果 ${fruitCount} 份⁠;
setMasterSpeech(⁠「信士誠心供奉吉利鮮果！大仙感應，賜予四季平安、諸事吉利！」⁠);
}
function offerIngotAction() {
playChime();
ingotCount++;
document.getElementById('ingot-count').innerText = ⁠元寶 ${ingotCount} 份⁠;
setMasterSpeech(⁠「信士誠心供奉金元寶！黃大仙大發慈悲，招財進寶、家業興旺！」⁠);
}
function touchGoldenStatue() {
playChime();
setMasterSpeech("「你誠心瞻仰黃大仙開懷金身聖像，金光護體，百病不侵，吉氣綿綿！」");
}
function tieRedThread() {
playChime();
setMasterSpeech("「三生石上舊精魂，月老尊神已為你牽上紅絲線，祝願佳偶天成、合家美滿！」");
}
function setMasterSpeech(text) {
document.getElementById('master-speech').innerText = text;
}
function playWoodenFishSound() {
if (!isSoundOn) return;
try {
const synth = new Tone.MembraneSynth().toDestination();
synth.volume.value = -6;
synth.triggerAttackRelease("C3", "16n");
} catch (e) {}
}
function playChime() {
if (!isSoundOn) return;
try {
const synth = new Tone.PolySynth(Tone.Synth).toDestination();
synth.volume.value = -10;
synth.triggerAttackRelease(["E5", "G#5", "B5"], "8n");
} catch (e) {}
}
function toggleSound() {
isSoundOn = !isSoundOn;
const btn = document.getElementById('sound-btn');
btn.innerHTML = isSoundOn
? '<i data-lucide="volume-2" class="w-4 h-4"></i>'
: '<i data-lucide="volume-x" class="w-4 h-4"></i>';
lucide.createIcons();
}
async function sendPrayerToMaster() {
const input = document.getElementById('user-prayer-input');
const prayerText = input.value.trim();
if (!prayerText) return;
playChime();
setMasterSpeech("「神明正聆聽你的心願祈求...」");
input.value = "";
try {
const systemPrompt = "你現在扮演香港赤松黃大仙祠的神仙導師，語氣慈祥、玄妙、充滿傳統道教智慧。請用簡短兩至三句話回應信士的祈願並給予祝福。";
const apiKey = "";
const apiUrl = ⁠https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}⁠;
const response = await fetch(apiUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: ⁠信士祈願：${prayerText}⁠ }] }],
systemInstruction: { parts: [{ text: systemPrompt }] }
})
});
const data = await response.json();
const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
if (reply) {
setMasterSpeech(⁠「${reply}」⁠);
saveRecordDirectly('心願祈福', prayerText, reply);
} else {
setMasterSpeech("「神明已聽取你的心願，只要誠心正道，必獲大仙福報庇佑！」");
}
} catch (err) {
setMasterSpeech("「誠心至感，神明已收到你的心願。諸惡莫作，眾善奉行！」");
}
}
const LOTS_DATABASE = [
{ number: "第一籤", title: "姜太公釣魚", type: "上上籤", poem: "太公家業在渭濱，志在清閑得意春。直鉤釣魚任順逆，遇合知音便功成。", meaning: "時來運到，貴人相助。目前宜沉住氣，保持平常心，機緣一到即可成功，事業與財運皆大吉。" },
{ number: "第十一籤", title: "漢高祖入關", type: "上吉籤", poem: "威風凜凜入秦關，百姓迎歡盡解顏。順天應人得民心，功業宏開名世間。", meaning: "大吉大利，得人心者得天下。若進行新計劃或創業，將順理成章，獲得大眾支持與成功。" },
{ number: "第二十四籤", title: "劉基歸藩", type: "中吉籤", poem: "功成身退隱山林，拂袖歸去樂自然。莫貪世上功名祿，清心寡欲保平安。", meaning: "適可而止，知足常樂。事業有成時宜保持謙遜，切忌過度貪婪，身體健康與家庭和睦為重。" },
{ number: "第四十一籤", title: "張良遇黃石公", type: "上吉籤", poem: "圯橋進履禮謙恭，忍辱負重得真傳。黃石公賜素書卷，輔佐漢室建功勳。", meaning: "尊師重道，謙虛受教。凡事需多忍耐與學習，前輩或長官將成為你關鍵的貴人。" },
{ number: "第八十八籤", title: "韓信點兵", type: "中平籤", poem: "兵多將廣任調遣，運籌帷幄算無遺。切莫驕矜用過度，慎防後路防危機。", meaning: "能力充足但不可傲慢。理財投資需留後路，切忌孤注一擲，凡事步步為營可保平順。" }
];
function openDrawModal() {
playChime();
document.getElementById('draw-modal').classList.remove('hidden');
document.getElementById('lot-result-card').classList.add('hidden');
document.getElementById('shake-btn').classList.remove('hidden');
document.getElementById('shake-btn').disabled = false;
document.getElementById('shake-btn').innerText = "誠心搖動籤筒";
}
function closeDrawModal() {
document.getElementById('draw-modal').classList.add('hidden');
}
function shakeDivinationStick() {
const cylinder = document.getElementById('cylinder-box');
const btn = document.getElementById('shake-btn');
let interval = setInterval(playWoodenFishSound, 120);
cylinder.classList.add('shake-animation');
btn.disabled = true;
btn.innerText = "求籤中，請誠心默禱...";
setTimeout(() => {
clearInterval(interval);
cylinder.classList.remove('shake-animation');
btn.classList.add('hidden');
const randomLot = LOTS_DATABASE[Math.floor(Math.random() * LOTS_DATABASE.length)];
currentLotResult = randomLot;
document.getElementById('lot-number').innerText = randomLot.number + " · " + randomLot.title;
const typeEl = document.getElementById('lot-type');
typeEl.innerText = randomLot.type;
typeEl.className = "ml-2 px-2 py-0.5 rounded text-xs font-bold " +
(randomLot.type.includes("上") ? "bg-red-600 text-yellow-100" : "bg-amber-600 text-white");
document.getElementById('lot-poem').innerText = ⁠「${randomLot.poem}」⁠;
document.getElementById('lot-meaning').innerText = randomLot.meaning;
document.getElementById('lot-result-card').classList.remove('hidden');
playChime();
setMasterSpeech(⁠「信士求得 ${randomLot.number} (${randomLot.type})。${randomLot.meaning.slice(0, 30)}...」⁠);
}, 1800);
}
function speakLotInterpretation() {
if (!currentLotResult) return;
const text = ⁠赤松黃大仙靈籤，${currentLotResult.number}，${currentLotResult.title}。${currentLotResult.type}。籤詩曰：${currentLotResult.poem}。大仙解曰：${currentLotResult.meaning}⁠;
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'zh-HK';
utterance.rate = 0.9;
window.speechSynthesis.speak(utterance);
}
}
function savePrayerRecord() {
if (!currentLotResult) return;
saveRecordDirectly('靈籤求卜', ⁠${currentLotResult.number} - ${currentLotResult.title}⁠, currentLotResult.meaning);
alert("已成功保存至參拜紀錄！");
closeDrawModal();
}
function saveRecordDirectly(type, title, detail) {
const record = { id: Date.now(), date: new Date().toLocaleDateString('zh-HK'), type, title, detail };
prayerRecords.unshift(record);
localStorage.setItem('wongtaisin_prayers', JSON.stringify(prayerRecords));
}
function openHistoryModal() {
playChime();
const list = document.getElementById('history-list');
list.innerHTML = "";
if (prayerRecords.length === 0) {
list.innerHTML = ⁠<p class="text-center text-yellow-200/50 py-6">暫無參拜與求籤紀錄</p>⁠;
} else {
prayerRecords.forEach(r => {
const card = document.createElement('div');
card.className = "p-3 bg-black/60 border border-temple-gold/40 rounded-lg space-y-1 shadow";
card.innerHTML = ⁠<div class="flex justify-between text-temple-gold font-bold text-xs"> <span>[${r.type}] ${r.title}</span> <span class="text-[10px] text-yellow-200/50">${r.date}</span> </div> <p class="text-yellow-100/80 text-xs">${r.detail}</p>⁠;
list.appendChild(card);
});
}
document.getElementById('history-modal').classList.remove('hidden');
}
function closeHistoryModal() {
document.getElementById('history-modal').classList.add('hidden');
}
</script>
