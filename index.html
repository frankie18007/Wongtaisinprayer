<script>
lucide.createIcons();
let isSoundOn = true;
let currentLotResult = null;
let prayerRecords = JSON.parse(localStorage.getItem('wongtaisin_prayers') || '[]');
// Smoke Canvas Setup
const canvas = document.getElementById('incense-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
function resizeCanvas() {
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
function switchRealScene(sceneKey) {
playChime();
const sMain = document.getElementById('scene-main');
const sStatue = document.getElementById('scene-statue');
const sYueLao = document.getElementById('scene-yuelao');
const aMain = document.getElementById('actions-main');
const aStatue = document.getElementById('actions-statue');
const aYueLao = document.getElementById('actions-yuelao');
// Reset scene opacity
[sMain, sStatue, sYueLao].forEach(s => {
s.style.opacity = '0';
s.style.transform = 'scale(0.95)';
s.style.pointerEvents = 'none';
});
[aMain, aStatue, aYueLao].forEach(a => a.classList.add('hidden'));
let locationTitle = "";
let speechText = "";
let speakerName = "赤松黃大仙尊者 顯聖法音";
if (sceneKey === 'main') {
sMain.style.opacity = '1';
sMain.style.transform = 'scale(1)';
aMain.classList.remove('hidden');
aMain.classList.add('grid');
locationTitle = "當前位置：正殿 赤松黃大仙祠";
speechText = "「歡迎來到香港赤松黃大仙祠正殿。信士可在此誠心上香、供奉吉果金元寶或搖筒求靈籤。」";
} else if (sceneKey === 'statue') {
sStatue.style.opacity = '1';
sStatue.style.transform = 'scale(1)';
aStatue.classList.remove('hidden');
aStatue.classList.add('grid');
locationTitle = "當前位置：從心苑 黃大仙開懷金身聖像";
speechText = "「此乃從心苑黃大仙開懷金身聖像。大仙慈悲開懷，普濟勸善。點擊『瞻仰金身』可沾納吉氣平安！」";
} else if (sceneKey === 'yueLao') {
sYueLao.style.opacity = '1';
sYueLao.style.transform = 'scale(1)';
aYueLao.classList.remove('hidden');
aYueLao.classList.add('grid');
locationTitle = "當前位置：月老殿 (殿前金童繩繫三生約)";
speakerName = "月老尊神 慈悲指引";
speechText = "「殿前金童繩繫三生約。誠心在月老尊神前牽繫紅線，祈求千里姻緣一線牽、合家美滿！」";
}
document.getElementById('current-location-tag').innerText = locationTitle;
document.getElementById('speaker-title').innerText = speakerName;
document.getElementById('master-text').innerText = speechText;
}
// Incense Smoke Particle Generator
function triggerIncenseSmoke() {
playWoodenFishSound();
const startX = window.innerWidth / 2;
const startY = window.innerHeight * 0.7;
for (let i = 0; i < 35; i++) {
particles.push({
x: startX + (Math.random() - 0.5) * 40,
y: startY,
vx: (Math.random() - 0.5) * 1.5,
vy: -Math.random() * 2.5 - 1.5,
radius: Math.random() * 12 + 8,
alpha: 0.8
});
}
setMasterSpeech("「赤松正殿三柱清香升起，上達天庭。黃大仙感應你的誠心，賜福保佑平安！」");
}
function updateParticles() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
for (let i = 0; i < particles.length; i++) {
let p = particles[i];
p.x += p.vx;
p.y += p.vy;
p.radius += 0.3;
p.alpha -= 0.008;
ctx.beginPath();
ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
ctx.fillStyle = ⁠rgba(245, 245, 220, ${p.alpha})⁠;
ctx.fill();
if (p.alpha <= 0) {
particles.splice(i, 1);
i--;
}
}
requestAnimationFrame(updateParticles);
}
updateParticles();

async function sendPrayerToMaster() {
const input = document.getElementById('user-prayer-input');
const prayerText = input.value.trim();
if (!prayerText) return;
playChime();
setMasterSpeech("「神明正聆聽你的祈願，為你祈福...」");
input.value = "";
try {
const systemPrompt = "你現在扮演香港赤松黃大仙祠的神仙導師，語氣慈祥、玄妙、充滿傳統智慧。請用簡短兩至三句話回應信士的祈願並給予祝福。";
const apiKey = "";
const apiUrl = ⁠https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}⁠;
const response = await fetch(apiUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: ⁠信士祈願：${prayerText}⁠ }] }],
systemInstruction: { parts: [{ text: systemPrompt }] }
})
});
const data = await response.json();
const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
if (reply) {
setMasterSpeech(⁠「${reply}」⁠);
saveRecordDirectly('心願祈福', prayerText, reply);
} else {
setMasterSpeech("「神明已聽取你的心願，只要誠心正道，必獲福報！」");
}
} catch (err) {
setMasterSpeech("「誠心至感，神明已收到你的心願。諸惡莫作，眾善奉行！」");
}
}

function shakeDivinationStick() {
const cylinder = document.getElementById('cylinder-box');
const btn = document.getElementById('shake-btn');
let interval = setInterval(playWoodenFishSound, 120);
cylinder.classList.add('shake-animation');

setTimeout(() => {

btn.classList.add('hidden');
const randomLot = LOTS_DATABASE[Math.floor(Math.random() * LOTS_DATABASE.length)];

function speakLotInterpretation() {
if (!currentLotResult) return;
const text = ⁠赤松黃大仙靈籤，${currentLotResult.number}，${currentLotResult.title}。${currentLotResult.type}。籤詩曰：${currentLotResult.poem}。大仙解曰：${currentLotResult.meaning}⁠;
if ('speechSynthesis' in window) {
window.speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(text);
utterance.lang = 'zh-HK';
utterance.rate = 0.9;
window.speechSynthesis.speak(utterance);
}
}
function savePrayerRecord() {
if (!currentLotResult) return;
saveRecordDirectly('靈籤求卜', ⁠${currentLotResult.number} - ${currentLotResult.title}⁠, currentLotResult.meaning);

function saveRecordDirectly(type, title, detail) {
const record = { id: Date.now(), date: new Date().toLocaleDateString('zh-HK'), type, title, detail };
prayerRecords.unshift(record);
localStorage.setItem('wongtaisin_prayers', JSON.stringify(prayerRecords));
}
